- name: nose
  skeleton:
  - - nose(bottom)
    - nose(tip)
  - - nose(tip)
    - nose(top)
  - - nose(top)
    - nose(bottom)
- name: whiskers(left)
  skeleton:
  - - pad(top)(left)
    - pad(side)(left)
  - - pad(side)(left)
    - pad(center)
  - - pad(center)
    - pad(top)(left)
- name: whiskers(right)
