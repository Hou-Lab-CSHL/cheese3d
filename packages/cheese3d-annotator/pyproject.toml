[project]
name = "cheese3d-annotator"
version = "0.1.0"
description = "Napari plugin for picking frames and annotating mouse faces in Cheese3D."
authors = [
    { name = "Hou Lab", email = "the.hou.lab@gmail.com"},
    { name = "Kyle Daruwalla", email = "daruwal@cshl.edu"},
    { name = "Rubin Zhao", email = "rzhao@cshl.edu"}
]
readme = "../../README.md"
requires-python = ">=3.10"
dependencies = [
    "tables>=3.7.0",
    "pandas>=2.1.4",
    "napari==0.5.*",
    "napari-video==0.2.*",
    "magicgui==0.10.*",
    "numpy>=1.23.2",
    "scikit-image>=0.24.0",
    "imageio>=2.37.2",
    "qtpy==2.4.*",
    "PyQt5==5.15.*",
    "pyqtgraph==0.13.*"
]

[project.entry-points."napari.manifest"]
cheese3d_annotator = "cheese3d_annotator:napari.yaml"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["cheese3d_annotator"]

[tool.hatch.metadata]
allow-direct-references = true
