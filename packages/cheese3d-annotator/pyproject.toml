[project]
name = "cheese3d-annotator"
version = "0.1.0"
description = "Napari plugin for picking frames and annotating mouse faces in Cheese3D."
authors = [
    { name = "Hou Lab", email = "the.hou.lab@gmail.com"},
    { name = "Kyle Daruwalla", email = "daruwal@cshl.edu"},
    { name = "Rubin Zhao", email = "rzhao@cshl.edu"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.1.4",
    "napari==0.5.*",
    "napari-video==0.2.*",
    "magicgui==0.10.*",
    "numpy>=1.23.2",
    "scikit-image>=0.24.0",
    "imageio>=2.37.2",
    "qtpy==2.4.*",
    "PyQt5==5.15.*",
    "pyqtgraph==0.13.*"
]

[project.entry-points."napari.manifest"]
cheese3d_annotator = "cheese3d_annotator:napari.yaml"

[build-system]
requires = ["uv_build>=0.11.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "."

[tool.uv]
package = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
publish-url = "https://upload.pypi.org/legacy/"

[[tool.uv.index]]
name = "test-pypi"
url = "https://test.pypi.org/simple"
publish-url = "https://test.pypi.org/legacy/"
