[project]
name = "cheese3d"
version = "0.1.1"
description = "Sensitive detection and analysis of whole-face movement in mice."
authors = [{ name = "Hou Lab CSHL", email = "the.hou.lab@gmail.com" }]
readme = "README.md"
requires-python = ">= 3.10"
scripts = { cheese3d = "cheese3d.cli:cli" }
dependencies = [
    "pip>=25.2,<26",
    # "ipython",
    # "ipykernel",
    # "jupyter",
    # "protobuf < 3.20",
    "pandas >= 2.1",
    # "configobj == 5.0.8",
    "hydra-core == 1.3.*",
    "toml >= 0.10",
    # "joblib == 1.5.*",
    "ensemble-kalman-smoother >= 0.1.0",
    "aniposelib >= 0.8.0",
    "anipose >= 1.1.24",
    # "opencv-python >= 4.10.0.84",
    # "opencv-python-headless >= 4.10.0.84",
    "opencv-contrib-python >= 4.10.0.84",
    "pims >= 0.7",
    "av",
    "scikit-video",
    "seaborn",
    "tqdm",
    "filelock",
    "open-ephys-python-tools == 0.1.12",
    "typer-slim[standard] >= 0.15.3, < 0.16",
    "questionary",
    "textual == 6.8.*",
    "textual-fspicker == 0.6.*",
    "textual_serve == 1.1.*",
    "cheese3d_annotator == 0.1.0",
]

[project.optional-dependencies]
dlc = [
    # "tables>=3.10.1",
    # "tensorflow < 2.13; sys_platform == 'linux'",
    "deeplabcut[tf-cu12] >= 3.0.0 ; sys_platform == 'linux'",
    # "tensorflow-macos < 2.13 ; sys_platform == 'darwin'",
    # "tensorflow-metal ; sys_platform == 'darwin'",
    "deeplabcut[apple_mchips] >= 3.0.0 ; sys_platform == 'darwin'",
]
lp = [
    "lightning-pose == 2.2.0",
    "tables >= 3.9",
]
cuda12 = [
    "jax[cuda12]; sys_platform == 'linux'",
]
cuda13 = [
    "jax[cuda13]; sys_platform == 'linux'",
]

[build-system]
requires = ["uv_build>=0.11.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "."

[tool.uv]
package = true
conflicts = [
    [
        { extra = "dlc" },
        { extra = "lp" },
    ],
    [
        { extra = "cuda12" },
        { extra = "cuda13" },
    ]
]

[tool.uv.sources]
torch = { index = "pytorch-cu126", marker = "extra == 'cuda12'" }

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
publish-url = "https://upload.pypi.org/legacy/"

[[tool.uv.index]]
name = "test-pypi"
url = "https://test.pypi.org/simple"
publish-url = "https://test.pypi.org/legacy/"

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=cheese3d",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "gpu: marks tests that require GPU",
    "ephys: marks tests that require ephys data",
    "video: marks tests that require video data",
]

[tool.coverage.run]
source = ["cheese3d"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
